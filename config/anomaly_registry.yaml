# Anomaly registry — the Agent's "list of known outcomes".
#
# One entry per DQ/reconciliation check. Check names mirror
# GeneralLedgerGenerator/notebooks/dq_gate.py VERBATIM, so a failing-check name
# parsed from the pipeline's output resolves directly to an entry here.
#
# This is the single source of truth for "is this failure a deterministic data
# defect the Agent should investigate?". New anomaly classes are added as new
# rows here (config, not code) — this is the extension point for the growing
# knowledge base. Phase 3 will hang remediation actions off these same entries.
#
# Fields:
#   gate          dq_gate | reconciliation   (which suite the check belongs to)
#   defect_class  the named scenario this check catches (DESIGN.md §6)
#   deterministic true for every data-defect check (all 7 are, by construction)
#   fails_task    does tripping this check FAIL the Databricks task today?
#                 dq_gate checks raise -> task fails -> Agent is woken.
#                 reconciliation checks only print -> task succeeds -> the Agent
#                 is NOT woken yet. See DESIGN Tier-D / PIPELINE_CONTRACT.md.
#   remediation   (Phase 3, optional) the correcting-action slug the drafter
#                 dispatches on (DESIGN §6). All seven are DECLARED here so the
#                 map is complete, but only `restore_intercompany_side` is
#                 IMPLEMENTED this session; the other slugs raise a clear
#                 "not yet implemented" until the generalization pass.

checks:
  debits_equal_credits:
    gate: dq_gate
    defect_class: unbalanced_voucher
    deterministic: true
    fails_task: true
    # Restore the altered line to its seed baseline (which re-balances the voucher).
    # More faithful than appending a plug line, which would leave the wrong amount.
    remediation: restore_voucher_balance

  no_duplicate_vouchers:
    gate: dq_gate
    defect_class: duplicate_voucher
    deterministic: true
    fails_task: true
    remediation: remove_duplicate_line

  account_in_coa:
    gate: dq_gate
    defect_class: unmapped_account
    deterministic: true
    fails_task: true
    remediation: map_account

  required_dimensions_present:
    gate: dq_gate
    defect_class: missing_department
    deterministic: true
    fails_task: true
    remediation: populate_dimension

  entity_and_period_present:
    gate: dq_gate
    defect_class: missing_entity_or_period
    deterministic: true
    fails_task: true
    remediation: populate_field

  # --- reconciliation checks: known, but NOT task-failing today (Phase 2 / Tier D) ---
  period_cutoff_correct:
    gate: reconciliation
    defect_class: period_cutoff
    deterministic: true
    fails_task: false
    remediation: shift_period

  intercompany_eliminates:
    gate: reconciliation
    defect_class: intercompany_out_of_balance
    deterministic: true
    fails_task: false
    remediation: restore_intercompany_side
